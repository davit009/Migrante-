name: Keep Supabase Alive

on:
  schedule:
    # Cada 3 días a las 08:00 UTC (Supabase pausa proyectos tras 7 días sin actividad)
    - cron: '0 8 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint /api/keep-alive
        run: |
          if [ -z "${{ secrets.KEEP_ALIVE_URL }}" ]; then
            echo "Falta el secret KEEP_ALIVE_URL (URL pública de la app, ej. https://tu-app.vercel.app)."
            exit 1
          fi
          curl -sf --retry 3 --retry-delay 5 "${{ secrets.KEEP_ALIVE_URL }}/api/keep-alive"
